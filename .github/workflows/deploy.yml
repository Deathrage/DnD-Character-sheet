# Deploys to Firebase Hosting: `main` goes live, a pull request gets a preview channel.
# The secret was created by `firebase init hosting:github`; the project is in `.firebaserc`.
name: Deploy

on:
  push:
    branches: [main]
  pull_request:

jobs:
  deploy:
    # A fork's pull request gets no secrets, so it could not deploy anyway.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DND_CHARACTER_SHEET_64A24 }}
          projectId: dnd-character-sheet-64a24
          channelId: ${{ github.event_name == 'push' && 'live' || '' }}
      # Rules are live-only: a preview channel has no rules of its own, so a pull request must not
      # replace the live ones. Needs the deploy service account to hold "Firebase Rules Admin".
      - if: github.event_name == 'push'
        run: |
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT_DND_CHARACTER_SHEET_64A24 }}' > "$RUNNER_TEMP/sa.json"
          GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json" npx --yes firebase-tools@latest deploy --only firestore:rules --project dnd-character-sheet-64a24 --non-interactive
