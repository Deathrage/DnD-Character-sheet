# Checks every pull request; deploys `main` to Firebase Hosting live. No preview channels.
# The secret was created by `firebase init hosting:github`; the project is in `.firebaserc`.
name: Deploy

on:
  push:
    branches: [main]
  pull_request:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - if: github.event_name == 'push'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DND_CHARACTER_SHEET_64A24 }}
          projectId: dnd-character-sheet-64a24
          channelId: live
      # Needs the deploy service account to hold "Firebase Rules Admin".
      - if: github.event_name == 'push'
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DND_CHARACTER_SHEET_64A24 }}
        run: |
          # Through `env` and `printf`, not interpolated into the script: a key containing a quote
          # would break an `echo '...'` and put the secret into the shell's parse.
          trap 'rm -f "$RUNNER_TEMP/sa.json"' EXIT
          printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"
          GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json" npx --yes firebase-tools@15 deploy --only firestore:rules --project dnd-character-sheet-64a24 --non-interactive
