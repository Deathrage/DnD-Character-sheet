<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- No `viewport-fit=cover`, on purpose. It lets Chrome on Android draw the page under the
         system navigation bar, and in the installed app, after a reload, it did so while
         reporting a bottom safe-area inset of 0 — so nothing could pad for the bar and the
         bottom of every screen sat beneath it. Nothing here needs to reach under a system bar.
         No `maximum-scale`: pinch-zoom is an accessibility feature, not a layout bug. -->
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#6d6ff0" />
    <!--
      Relative, like everything else here, because vite.config.ts sets `base: ''` so the build
      works from any directory. The manifest exists to make the app installable: installing is the
      route by which Chrome will actually grant persistent storage, and the persistence gate's own
      refused screen tells the player to do it. Without this that advice was a dead end.

      Hand-written rather than generated: vite.config.ts sets `manifest: false` on vite-plugin-pwa,
      which supplies only the service worker that lets the installed app start offline.
    -->
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icon-192.png" type="image/png" />
    <link rel="apple-touch-icon" href="icon-192.png" />
    <title>Character Sheet</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
