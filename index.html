<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- `viewport-fit=cover` so the phone layout can reach under the notch; `styles.css` pads
         with env(safe-area-inset-*). No `maximum-scale`: pinch-zoom is an accessibility feature,
         not a layout bug. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <meta
      name="theme-color"
      content="#1b1d2e"
      media="(prefers-color-scheme: dark)"
      data-scheme="dark"
    />
    <meta
      name="theme-color"
      content="#f7f6f3"
      media="(prefers-color-scheme: light)"
      data-scheme="light"
    />
    <!--
      Relative, like everything else here, because vite.config.ts sets `base: ''` so the build
      works from any directory. The manifest exists to make the app installable: installing is the
      route by which Chrome will actually grant persistent storage, and the persistence gate's own
      refused screen tells the player to do it. Without this that advice was a dead end.

      Hand-written rather than generated: vite.config.ts sets `manifest: false` on vite-plugin-pwa,
      which supplies only the service worker that lets the installed app start offline.
    -->
    <link rel="manifest" href="manifest.webmanifest" />
    <!-- The SVG where the browser takes one, sharp at any tab size; the PNG where it does not.
         Every PNG icon is rendered from the SVG named in its own comment: favicon.svg, icon.svg,
         icon-maskable.svg. Apple's is full-bleed because iOS rounds the corners itself. -->
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="icon-192.png" type="image/png" sizes="192x192" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <title>Character Sheet</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
